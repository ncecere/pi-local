name: v0.5 Windows desktop compile
on:
  push:
    branches: [v0.5, v05/windows-sdk-dependency]
    paths:
      - '.github/workflows/v05-windows-sdk-dependency.yml'
      - 'cmd/pi-local/**'
      - 'internal/**'
      - 'runtime/**'
      - 'frontend/**'
      - 'packaging/licenses/build-receipt.mjs'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    if: github.ref == 'refs/heads/v0.5' || github.ref == 'refs/heads/v05/windows-sdk-dependency'
    name: Windows amd64 build and test compile only
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Enable pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          test "$(go env GOVERSION)" = go1.26.10
          test "$(node --version)" = v22.23.0
          (cd runtime && test "$(pnpm --version)" = 11.18.0)
          (cd frontend && test "$(pnpm --version)" = 11.18.0)
      - name: Frozen package-cwd assets before Go embed
        run: |
          set -euo pipefail
          (cd runtime && pnpm install --frozen-lockfile && pnpm bundle)
          (cd frontend && pnpm install --frozen-lockfile && pnpm build)
      - name: Compile only; never launch the desktop or its test binary
        run: |
          set -euo pipefail
          out=$(mktemp -d "$RUNNER_TEMP/pi-local-windows-sdk.XXXXXX")
          trap 'rm -rf "$out"' EXIT
          go build -o "$out/pi-local.exe" ./cmd/pi-local
          go test -c -o "$out/pi-local.test.exe" ./cmd/pi-local
      - name: Assert dependency files unchanged even on failure
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- go.mod go.sum runtime/pnpm-lock.yaml frontend/pnpm-lock.yaml
# No go test execution, app/server invocation, packaging, release, or artifact upload.
# Windows Server compilation is not Windows 11/WebView2 UI/runtime acceptance.
