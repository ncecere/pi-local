name: v0.5 offline Linux helper candidate
on:
  push:
    branches: [v05/linux-sandbox-helper]
    paths:
      - '.github/workflows/v05-linux-helper.yml'
      - 'cmd/pi-local-sandbox/**'
      - 'internal/linuxsandbox/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confinement:
    name: Ubuntu 24.04 candidate confinement
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install distribution engine and record topology
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap gcc
          test "$(id -u)" != 0
          id
          uname -a
          dpkg-query -W bubblewrap
          /usr/bin/bwrap --version
          /usr/bin/bwrap --help
          for path in / /usr /tmp; do findmnt -T "$path" -o TARGET,FSTYPE,PROPAGATION; done
          # Read only: missing keys are diagnostic, never a request to change policy.
          sysctl kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns || true
      - name: Diagnose isolated engine admission without changing host policy
        shell: bash
        run: |
          set -euo pipefail
          # All probes retain network isolation, import only trusted /usr read-only,
          # and run /usr/bin/true. These are engine diagnostics, not confinement passes.
          base=(/usr/bin/bwrap --unshare-user --unshare-net)
          root=(--ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 --chdir / -- /usr/bin/true)
          for nnp in 0 1; do
            for caps in 0 1; do
              prefix=(); drop=()
              if test "$nnp" = 1; then prefix=(/usr/bin/setpriv --no-new-privs); fi
              if test "$caps" = 1; then drop=(--cap-drop ALL); fi
              printf 'NNP-before-exec=%s cap-drop=%s\n' "$nnp" "$caps"
              if /usr/bin/env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C HOME=/home/sandbox TMPDIR=/tmp \
                "${prefix[@]}" "${base[@]}" "${drop[@]}" "${root[@]}"; then
                echo 'engine probe: PASS'
              else
                echo "engine probe: FAIL:$?"
              fi
            done
          done
      - name: Unit contracts and static helper
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=5m ./internal/linuxsandbox ./cmd/pi-local-sandbox
          go vet ./internal/linuxsandbox ./cmd/pi-local-sandbox
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/pi-local-sandbox" ./cmd/pi-local-sandbox
      - name: Explicit native candidate gate
        shell: bash
        env:
          CGO_ENABLED: '0'
          PI_LOCAL_SANDBOX_NATIVE_TESTS: '1'
        run: |
          set -euo pipefail
          go test -count=1 -timeout=8m -v ./internal/linuxsandbox
# The shipped helper remains hard-disabled. This executes a test-only driver
# using synthetic temporary data. An unavailable engine/topology is a FAILURE,
# never a skip or permission to weaken AppArmor, namespaces or mount policies.
