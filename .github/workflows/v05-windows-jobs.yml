name: v0.5 owned child lifecycle
on:
  push:
    branches: [v0.5, v05/windows-jobs, v05/appcontainer-candidate, v05/appcontainer-fixtures, v05/appcontainer-asuser-fixture]
    paths:
      - '.github/workflows/v05-windows-jobs.yml'
      - 'internal/process/**'
      - 'internal/supervisor/**'
      - 'internal/mcp/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Native child lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - name: Native lifecycle and integration tests
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go version
          # Collect every required lane even if normal detects an early refusal.
          # Any nonzero result keeps the aggregate gate red.
          normal=0
          go test -count=1 -timeout=10m -v ./internal/process ./internal/supervisor ./internal/mcp || normal=$?
          race=0
          go test -race -count=1 -timeout=10m -v ./internal/process ./internal/supervisor ./internal/mcp || race=$?
          vet=0
          go vet ./internal/process ./internal/supervisor ./internal/mcp || vet=$?
          printf 'Required exit codes: normal=%s race=%s vet=%s\n' "$normal" "$race" "$vet"
          test "$normal" -eq 0 && test "$race" -eq 0 && test "$vet" -eq 0
# Synthetic helper processes and temporary data only. Native Windows Server tests
# establish kernel lifecycle contracts, not Windows 11 UI or AppContainer parity.
