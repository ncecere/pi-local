name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Apple Silicon: the app, its tests (the real runtime, node:sqlite) and the Wails shell build here.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - run: corepack enable
      - run: make deps
      - run: make runtime frontend
      - run: make check
