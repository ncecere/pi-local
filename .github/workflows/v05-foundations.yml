name: v0.5 platform contracts
on:
  push:
    branches: [v0.5]
    paths:
      - '.github/workflows/v05-foundations.yml'
      - 'internal/datalock/**'
      - 'internal/process/**'
      - 'internal/runtimeenv/**'
      - 'internal/supervisor/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Lock, process and environment (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - name: Native foundation contracts
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go version
          go test -count=1 -race -v ./internal/datalock ./internal/process ./internal/runtimeenv
          go vet ./internal/datalock ./internal/process ./internal/runtimeenv
# These are isolated contract tests using synthetic temporary directories and helper processes.
# Windows Server CI is not Windows 11 UI evidence; no WebView, sandbox, keyring or installer parity is claimed.
