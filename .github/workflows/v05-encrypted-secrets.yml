name: v0.5 encrypted secret core contracts
on:
  push:
    branches: [v0.5, v05/encrypted-secrets-core, v05/windows-private-secret-fs]
    paths:
      - '.github/workflows/v05-encrypted-secrets.yml'
      - 'internal/secrets/**'
      - 'internal/datalock/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Fake-vault core / private FS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Core contracts with synthetic data and injected vaults
        shell: bash
        run: |
          set -euo pipefail
          go version
          normal=0
          go test -count=1 -timeout=4m -v ./internal/secrets || normal=$?
          race=0
          go test -race -count=1 -timeout=5m -v ./internal/secrets || race=$?
          vet=0
          go vet ./internal/secrets || vet=$?
          printf 'Required exit codes: normal=%s race=%s vet=%s\n' "$normal" "$race" "$vet"
          test "$normal" -eq 0 && test "$race" -eq 0 && test "$vet" -eq 0
# No real Keychain, Credential Manager or Secret Service operations.
# Darwin/Linux use fake vaults. The Windows factory still refuses pre-I/O;
# separate inert Windows primitives use only temporary NTFS and SID-only Authz
# fixtures. Neither vault activation nor standard-user isolation is established.
