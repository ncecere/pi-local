name: v0.5 encrypted secret core contracts
on:
  push:
    branches: [v0.5, v05/encrypted-secrets-core]
    paths:
      - '.github/workflows/v05-encrypted-secrets.yml'
      - 'internal/secrets/**'
      - 'internal/datalock/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Fake-vault encrypted core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Core contracts with synthetic data and injected vaults
        shell: bash
        run: |
          set -euo pipefail
          go version
          go test -count=1 -timeout=4m -v ./internal/secrets
          go test -race -count=1 -timeout=5m -v ./internal/secrets
          go vet ./internal/secrets
# No real Keychain, Credential Manager or Secret Service operations.
# Darwin/Linux exercise the core with fake vaults; Windows tests refusal before
# filesystem/vault access. These are not native vault/ACL or activation evidence.
